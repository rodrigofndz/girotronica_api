name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator runs on the JVM
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15

      - run: npm install -g firebase-tools@15
      - run: npm ci
      - name: Type-check
        run: npm run build
      - name: Test against the emulators
        run: npm test
